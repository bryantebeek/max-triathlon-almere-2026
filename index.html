<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Almere - Halve Triathlon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:        #eef0f3;
    --surface:   #ffffff;
    --surface-2: #f6f7f9;
    --border:    #e2e5ea;
    --border-2:  #cfd4dc;
    --text:      #12161c;
    --text-2:    #55606f;
    --text-3:    #8a94a3;
    --accent:    #2b63e6;
    --live:      #159a52;
    --swim:      #1f8ae0;
    --bike:      #e8871f;
    --run:       #1ea365;
    --trans:     #8b7cd8;
    --finish:    #e0466f;
    --other:     #6b7684;
    --hero:      #0c1322;
    --hero-2:    #142038;
    --shadow:    0 1px 2px rgba(18,22,28,.05), 0 10px 28px -14px rgba(18,22,28,.18);
    --r:         16px;
    --display:   "Barlow Condensed", "Arial Narrow", Impact, sans-serif;
    --body:      "Barlow", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:        #0a0e15;
      --surface:   #131923;
      --surface-2: #171e2a;
      --border:    #222b38;
      --border-2:  #2f3a4a;
      --text:      #eef1f5;
      --text-2:    #a4aebc;
      --text-3:    #6d7787;
      --accent:    #6f9cff;
      --live:      #36c97c;
      --swim:      #4fa7f0;
      --bike:      #f2a24a;
      --run:       #3fc78f;
      --trans:     #a698ee;
      --finish:    #f06a8d;
      --other:     #8b95a3;
      --hero:      #070b13;
      --hero-2:    #0f1828;
      --shadow:    0 1px 2px rgba(0,0,0,.35), 0 10px 28px -14px rgba(0,0,0,.7);
    }
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: var(--body); font-size: 15px; line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  .num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; }
  .disp { font-family: var(--display); font-weight: 700; letter-spacing: .005em; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 18px 20px 72px; }
  .stack > * + * { margin-top: 18px; }

  /* ---------- top bar ---------- */
  .topbar { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 16px; }
  .brand { line-height: 1.15; }
  .brand .ev { font-family: var(--display); font-weight: 800; font-size: 22px; text-transform: uppercase; letter-spacing: .01em; }
  .brand .sub { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); }
  .live {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 11.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
    color: var(--live); background: color-mix(in srgb, var(--live) 12%, transparent);
    border: 1px solid color-mix(in srgb, var(--live) 35%, transparent);
    padding: 4px 10px; border-radius: 999px;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--live); animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .3; transform: scale(.8); } }
  @media (prefers-reduced-motion: reduce) { .dot, .cur .ic { animation: none !important; } }
  .spacer { flex: 1 1 auto; }
  .stamp { font-size: 12.5px; color: var(--text-3); }
  .btn {
    font: inherit; font-size: 13px; font-weight: 600; color: var(--text-2);
    background: var(--surface); cursor: pointer;
    border: 1px solid var(--border-2); border-radius: 9px; padding: 6px 13px;
    transition: color .15s, border-color .15s;
    text-decoration: none; display: inline-flex; align-items: center; line-height: 1.3;
  }
  .btn:hover { color: var(--text); border-color: var(--text-3); }
  .btn:active { transform: translateY(1px); }
  .btn[disabled] { opacity: .55; cursor: default; }

  /* ---------- athlete switcher ---------- */
  .tabs {
    display: flex; gap: 4px; padding: 4px; margin-bottom: 18px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 13px; box-shadow: var(--shadow);
  }
  .tab {
    flex: 1 1 0; min-width: 0; display: flex; align-items: center; justify-content: center; gap: 10px;
    padding: 9px 14px; border: 0; border-radius: 9px; background: transparent;
    color: var(--text-2); font: inherit; font-weight: 600; font-size: 14.5px; cursor: pointer;
    transition: background .15s, color .15s;
  }
  .tab:hover { color: var(--text); background: var(--surface-2); }
  .tab .n { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tab .b {
    font-family: var(--display); font-weight: 700; font-size: 15px; letter-spacing: .03em; line-height: 1.2;
    color: var(--text-3); padding: 2px 7px 1px; border-radius: 6px;
    background: var(--surface-2); border: 1px solid var(--border);
  }
  .tab[aria-selected="true"] { background: var(--text); color: var(--bg); }
  .tab[aria-selected="true"]:hover { background: var(--text); color: var(--bg); }
  .tab[aria-selected="true"] .b { background: var(--bg); color: var(--text); border-color: transparent; }

  /* ---------- cards ---------- */
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden;
  }

  /* ---------- hero ---------- */
  .hero {
    position: relative; overflow: hidden; border-radius: var(--r);
    color: #f4f6fa; box-shadow: var(--shadow);
    background:
      radial-gradient(760px 380px at 88% -30%, color-mix(in srgb, var(--c) 60%, transparent), transparent 62%),
      radial-gradient(500px 300px at 0% 110%, color-mix(in srgb, var(--c) 22%, transparent), transparent 60%),
      repeating-linear-gradient(-58deg, rgba(255,255,255,.028) 0 2px, transparent 2px 16px),
      linear-gradient(180deg, var(--hero-2), var(--hero));
  }
  .hero-in { padding: 28px 30px 26px; }
  .hero-row { display: flex; align-items: flex-start; gap: 22px; }
  .eyebrow {
    font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
    color: color-mix(in srgb, var(--c) 78%, #fff);
  }
  .hero h1 {
    margin: 4px 0 6px; font-family: var(--display); font-weight: 800; text-transform: uppercase;
    font-size: clamp(44px, 9vw, 78px); line-height: .95; letter-spacing: .005em;
  }
  .meta { display: flex; flex-wrap: wrap; gap: 6px 0; font-size: 14px; color: rgba(244,246,250,.7); }
  .meta span { white-space: nowrap; }
  .meta span:not(:last-child)::after { content: "·"; margin: 0 9px; opacity: .45; }
  .meta b { color: #fff; font-weight: 600; }
  .bib {
    flex: 0 0 auto; margin-left: auto; text-align: center;
    background: #fff; color: #0c1322; border-radius: 10px; padding: 8px 16px 6px;
    box-shadow: 0 6px 20px -8px rgba(0,0,0,.6);
  }
  .bib .k { display: block; font-size: 9.5px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: #6b7684; }
  .bib .v { display: block; font-family: var(--display); font-weight: 800; font-size: 40px; line-height: 1; letter-spacing: .01em; }

  /* race strip */
  .strip {
    list-style: none; margin: 26px 0 0; padding: 0;
    display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px;
  }
  .step {
    position: relative; padding: 12px 12px 11px; border-radius: 11px;
    background: rgba(255,255,255,.055); border: 1px solid rgba(255,255,255,.08);
    min-width: 0;
  }
  .step .hd { display: flex; align-items: center; gap: 7px; font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: rgba(244,246,250,.55); white-space: nowrap; }
  .step .ic { width: 22px; height: 22px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 12px; background: rgba(255,255,255,.1); flex: 0 0 auto; }
  .step .tm { margin-top: 6px; font-family: var(--display); font-weight: 700; font-size: 26px; line-height: 1; color: rgba(244,246,250,.35); }
  .step.done .hd { color: rgba(244,246,250,.8); }
  .step.done .ic { background: var(--sc); color: #fff; }
  .step.done .tm { color: #fff; }
  .step.cur { background: color-mix(in srgb, var(--sc) 22%, rgba(255,255,255,.04)); border-color: color-mix(in srgb, var(--sc) 55%, transparent); }
  .step.cur .hd { color: #fff; }
  .step.cur .ic { background: var(--sc); color: #fff; box-shadow: 0 0 0 0 color-mix(in srgb, var(--sc) 60%, transparent); animation: ring 2s ease-out infinite; }
  @keyframes ring { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--sc) 60%, transparent); } 100% { box-shadow: 0 0 0 9px transparent; } }
  .step.cur .tm { color: #fff; }
  .step.cur .tm small, .step .tm small { display: block; font-family: var(--body); font-weight: 600; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; margin-top: 4px; color: color-mix(in srgb, var(--sc) 80%, #fff); }

  /* ---------- stat tiles ---------- */
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
  .stat { background: var(--surface); border: 1px solid var(--border); border-radius: 13px; box-shadow: var(--shadow); padding: 14px 16px 13px; }
  .stat .k { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--text-3); }
  .stat .v { font-family: var(--display); font-weight: 700; font-size: 38px; line-height: 1.05; margin-top: 4px; }
  .stat .s { font-size: 12.5px; color: var(--text-3); margin-top: 2px; }
  .stat.hl { border-color: color-mix(in srgb, var(--accent) 35%, var(--border)); }
  .stat.hl .v { color: var(--accent); }
  .ldot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--live); margin-left: 5px; vertical-align: 1px; animation: pulse 2s ease-in-out infinite; }

  /* ---------- section head ---------- */
  .sec-head { display: flex; align-items: center; gap: 11px; padding: 13px 18px; border-bottom: 1px solid var(--border); background: var(--surface-2); }
  .sec-head .ic { width: 28px; height: 28px; border-radius: 8px; display: inline-grid; place-items: center; font-size: 15px; background: color-mix(in srgb, var(--c, var(--text-3)) 16%, transparent); flex: 0 0 auto; }
  .sec-head h2 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 20px; text-transform: uppercase; letter-spacing: .02em; line-height: 1; }
  .sec-head .sub { font-size: 12.5px; color: var(--text-3); margin-top: 2px; }
  .sec-head .tag { font-size: 10.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--c); background: color-mix(in srgb, var(--c) 14%, transparent); padding: 3px 8px; border-radius: 999px; }
  .sec-head .tot { margin-left: auto; font-family: var(--display); font-weight: 700; font-size: 26px; line-height: 1; color: var(--c); }
  .seg-card .sec-head { border-left: 4px solid var(--c); }

  /* ---------- tables ---------- */
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  thead th {
    font-size: 10.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
    color: var(--text-3); text-align: right; padding: 10px 14px 8px;
    border-bottom: 1px solid var(--border); white-space: nowrap;
  }
  thead th:first-child { text-align: left; padding-left: 18px; }
  tbody td { padding: 11px 14px; border-bottom: 1px solid var(--border); text-align: right; vertical-align: top; white-space: nowrap; }
  tbody td:first-child { text-align: left; padding-left: 18px; white-space: normal; }
  tbody tr:last-child td { border-bottom: 0; }
  tbody tr:hover td { background: var(--surface-2); }
  tbody tr.latest td { background: color-mix(in srgb, var(--c, var(--accent)) 7%, transparent); }
  .loc { font-weight: 600; font-size: 15px; }
  .loc .sub { display: block; font-size: 12px; color: var(--text-3); font-weight: 500; }
  .big { font-family: var(--display); font-weight: 700; font-size: 24px; line-height: 1; }
  .spd { font-size: 12px; color: var(--text-2); margin-top: 3px; }
  .rk { display: inline-flex; gap: 8px; margin-top: 4px; font-size: 12px; color: var(--text-2); }
  .rk span { display: inline-flex; align-items: baseline; gap: 3px; }
  .rk b { font-weight: 700; color: var(--text); font-size: 12.5px; }
  .rk i { font-style: normal; font-size: 9.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); }
  .muted { color: var(--text-3); font-weight: 400; }

  /* ---------- head-to-head ---------- */
  .h2h .lead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; padding: 16px 18px 14px; border-bottom: 1px solid var(--border); }
  .h2h .lead .who { font-family: var(--display); font-weight: 800; font-size: 26px; text-transform: uppercase; letter-spacing: .01em; line-height: 1; }
  .h2h .lead .gap { font-family: var(--display); font-weight: 800; font-size: 34px; line-height: 1; color: var(--accent); }
  .h2h .lead .at { font-size: 13px; color: var(--text-3); }
  .cmp { display: grid; grid-template-columns: 1.15fr 1fr 1fr 1.2fr; }
  .cmp > div { display: flex; flex-direction: column; justify-content: center; padding: 10px 14px; border-bottom: 1px solid var(--border); min-width: 0; }
  .cmp > div:nth-child(4n+1) { padding-left: 18px; }
  .cmp > div:nth-last-child(-n+4) { border-bottom: 0; }
  .cmp .hd { font-size: 10.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--text-3); text-align: right; padding-top: 12px; padding-bottom: 8px; background: var(--surface-2); }
  .cmp .hd.ath { flex-direction: row; justify-content: flex-end; align-items: center; gap: 7px; text-transform: none; letter-spacing: 0; font-size: 13.5px; font-weight: 700; color: var(--text); }
  .cmp .hd.ath .n { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cmp .hd.ath .b { font-family: var(--display); font-size: 13px; letter-spacing: .03em; color: var(--text-3); padding: 1px 6px; border-radius: 5px; background: var(--surface); border: 1px solid var(--border); }
  .cmp .lg { flex-direction: row; justify-content: flex-start; align-items: center; text-align: left; gap: 9px; font-weight: 600; font-size: 14px; }
  .cmp .hd.ath .n.short { display: none; }
  .cmp .dotc { width: 24px; height: 24px; border-radius: 7px; display: inline-grid; place-items: center; font-size: 12.5px; background: color-mix(in srgb, var(--sc) 16%, transparent); flex: 0 0 auto; }
  .cmp .tv { text-align: right; font-family: var(--display); font-weight: 700; font-size: 24px; line-height: 1; color: var(--text-2); }
  .cmp .tv.win { color: var(--text); }
  .cmp .tv.lose { color: var(--text-3); }
  .cmp .tv small { display: block; font-family: var(--body); font-weight: 500; font-size: 11.5px; color: var(--text-3); margin-top: 4px; line-height: 1.2; }
  .cmp .df { text-align: right; font-size: 13px; color: var(--text-2); line-height: 1.3; }
  .cmp .df b { color: var(--text); }
  .cmp .df small { display: block; font-size: 11.5px; color: var(--text-3); }

  /* ---------- states ---------- */
  .msg { padding: 48px 24px; text-align: center; color: var(--text-3); }
  .msg .t { font-family: var(--display); font-weight: 700; font-size: 24px; color: var(--text); margin-bottom: 4px; }
  .msg.err .t { color: var(--finish); }

  footer { margin-top: 26px; font-size: 12px; color: var(--text-3); text-align: center; }
  footer a { color: var(--text-3); }

  @media (max-width: 720px) {
    .strip { grid-template-columns: repeat(3, 1fr); }
  }
  @media (max-width: 560px) {
    .wrap { padding: 14px 14px 56px; }
    .hero-in { padding: 20px 18px 18px; }
    .hero-row { flex-direction: column-reverse; gap: 12px; }
    .bib { margin-left: 0; align-self: flex-start; padding: 6px 12px 4px; }
    .bib .v { font-size: 30px; }
    .step .tm { font-size: 22px; }
    .stats { gap: 8px; grid-template-columns: repeat(2, 1fr); }
    .stat .v { font-size: 32px; }
    thead th:first-child, tbody td:first-child { padding-left: 14px; }
    .tab { flex-direction: column; padding: 8px 6px 7px; font-size: 13.5px; gap: 4px; }
    .tab .n { max-width: 100%; }
    .stats { grid-template-columns: repeat(6, 1fr); }
    .s-time, .s-last { grid-column: span 3; }
    .s-rank { grid-column: span 2; order: 2; }
    .s-last { order: 1; }
    .s-rank .v { font-size: 28px; }
  }
  /* narrow screens: each table row becomes a stacked card */
  @media (max-width: 640px) {
    .scroll table, .scroll tbody, .scroll tr { display: block; }
    .scroll thead { display: none; }
    .scroll tr { padding: 4px 0 8px; border-bottom: 1px solid var(--border); }
    .scroll tr:last-child { border-bottom: 0; }
    .scroll td { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 4px 16px; border: 0; white-space: normal; }
    .scroll td::before { content: attr(data-l); font-size: 10.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--text-3); flex: 0 0 auto; }
    .scroll td:first-child { padding: 10px 16px 6px; }
    .scroll td:first-child::before { display: none; }
    .scroll td .c { text-align: right; min-width: 0; }
    .scroll td:first-child .c { text-align: left; }
    .big { font-size: 22px; }
    .rk { justify-content: flex-end; flex-wrap: wrap; }
    .cmp { grid-template-columns: 1fr 1fr 1fr; }
    .cmp > div { padding: 9px 10px; border-bottom: 0; }
    .cmp > div:nth-child(4n+1) { padding-left: 14px; }
    .cmp .hd.df { display: none; }
    .cmp .df { grid-column: 1 / -1; padding-top: 0; padding-bottom: 9px; border-bottom: 1px solid var(--border); font-size: 12.5px; }
    .cmp .df:empty { padding: 0 0 6px; }
    .cmp > div:nth-last-child(-n+4) { border-bottom: 0; }
    .cmp .lg { font-size: 13px; gap: 6px; }
    .cmp .hd.ath .n.full { display: none; }
    .cmp .hd.ath .n.short { display: inline; }
    .cmp .tv { font-size: 21px; }
    .h2h .lead .who { font-size: 22px; }
    .h2h .lead .gap { font-size: 28px; }
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="topbar">
    <div class="brand">
      <div class="ev">Almere - Halve Triathlon</div>
      <div class="sub">Challenge Almere · 2026</div>
    </div>
    <span class="live"><span class="dot"></span>Live</span>
    <span class="spacer"></span>
    <span class="stamp" id="stamp"></span>
    <a class="btn" href="https://live.ultimate.dk/desktop/front/?eventid=7420&amp;ignoreuseragent=true" target="_blank" rel="noopener">UltimateLIVE ↗</a>
    <button class="btn" id="refresh" type="button">Ververs</button>
  </div>

  <nav class="tabs" id="tabs" role="tablist" aria-label="Atleet"></nav>

  <div id="app" class="stack">
    <div class="card"><div class="msg"><div class="t">Gegevens laden…</div><div>Even geduld</div></div></div>
  </div>

  <footer>
    Gegevens van <a href="https://live.ultimate.dk" target="_blank" rel="noopener">live.ultimate.dk</a> · ververst automatisch elke 30 s
  </footer>
</div>

<!-- the endpoint writes its HTML into this element -->
<div id="PARTICIPANTINFO" hidden></div>

<script>
(function () {
  'use strict';

  var ENDPOINT = 'https://live.ultimate.dk/desktop/front/data.php';
  var PARAMS = { eventid: '7420', mode: 'participantinfo', language: 'nl' };
  var ATHLETES = [
    { pid: '2579', name: 'Max Huisman' },
    { pid: '2580', name: 'Luuk van der Voort' }
  ];
  var REFRESH_MS = 30000;
  var LOADING = '<div class="card"><div class="msg"><div class="t">Gegevens laden…</div><div>Even geduld</div></div></div>';

  var app = document.getElementById('app');
  var tabs = document.getElementById('tabs');
  var stamp = document.getElementById('stamp');
  var refreshBtn = document.getElementById('refresh');
  var sink = document.getElementById('PARTICIPANTINFO');

  /* -------------------------------------------------------------
     Load. The endpoint has no CORS headers, but it is a plain JS
     file that assigns innerHTML — so a <script> tag loads it fine.
     The sink is shared, so athletes are fetched one after another.
     ------------------------------------------------------------- */
  function load(pid) {
    return new Promise(function (resolve, reject) {
      window._gaq = window._gaq || { push: function () {} };
      window.details_active = 0;
      window.ajaxprocess = 0;
      window.doCloseParticipantInfo = function () {};

      var old = document.getElementById('feed');
      if (old) old.remove();
      sink.innerHTML = '';

      var qs = [];
      for (var k in PARAMS) qs.push(k + '=' + encodeURIComponent(PARAMS[k]));
      qs.push('pid=' + encodeURIComponent(pid));
      qs.push('_=' + Date.now());

      var s = document.createElement('script');
      s.id = 'feed';
      s.src = ENDPOINT + '?' + qs.join('&');
      s.onload = function () {
        if (!sink.firstChild) reject(new Error('Geen gegevens ontvangen'));
        else resolve(sink);
      };
      s.onerror = function () { reject(new Error('Kon de server niet bereiken')); };
      document.head.appendChild(s);
    });
  }

  /* ------------------------------- parse ------------------------------- */
  function txt(el) { return el ? el.textContent.replace(/\s+/g, ' ').trim() : ''; }

  function parse(root) {
    var bigs = [].map.call(root.querySelectorAll('.participant_value_big'), txt);

    var info = [];
    [].forEach.call(root.querySelectorAll('td.participant_hdr_small'), function (el) {
      var v = el.nextElementSibling;
      if (v) info.push({ k: txt(el), v: txt(v) });
    });

    var segments = [], cur = null, projections = [], projTitle = '';
    [].forEach.call(root.querySelectorAll('tr'), function (tr) {
      var banner = tr.querySelector('td.split_segment');
      if (banner) { cur = { name: txt(banner), rows: [] }; segments.push(cur); return; }

      var c = [].map.call(tr.children, txt);

      if (tr.querySelector('td.details_racetime')) {
        if (!cur) { cur = { name: '', rows: [] }; segments.push(cur); }
        cur.rows.push({
          loc:      c[0],
          raceTime: c[1],  raceRank: [c[2], c[3], c[4]],
          segTime:  c[5],  segSpeed: c[6],  segRank: [c[7], c[8], c[9]],
          lapTime:  c[10], lapSpeed: c[11], lapRank: [c[12], c[13], c[14]],
          clock:    c[15]
        });
        return;
      }

      if (tr.querySelectorAll('td.split_time').length === 5 && !tr.querySelector('td.split_hdr')) {
        projections.push({ loc: c[0], raceTime: c[1], segTime: c[2], lapTime: c[3], clock: c[4] });
      }
    });

    var heads = [].map.call(root.querySelectorAll('.participant_section_hdr'), txt);
    if (projections.length && heads.length) projTitle = heads[heads.length - 1];

    var d = { name: bigs[0] || '', bib: bigs[1] || '', info: info, segments: segments.filter(function (s) { return s.rows.length; }), projections: projections, projTitle: projTitle };
    classify(d);
    return d;
  }

  /* ------------------------------ helpers ------------------------------ */
  var STEPS = [
    { key: 'swim',   label: 'Zwemmen', icon: '🏊', c: 'var(--swim)',   re: /swim|zwem/ },
    { key: 't1',     label: 'T1',      icon: '⇄',  c: 'var(--trans)',  re: /^t1|wissel ?1|transition ?1/ },
    { key: 'bike',   label: 'Fietsen', icon: '🚴', c: 'var(--bike)',   re: /bike|fiets|cycl|rad/ },
    { key: 't2',     label: 'T2',      icon: '⇄',  c: 'var(--trans)',  re: /^t2|wissel ?2|transition ?2/ },
    { key: 'run',    label: 'Lopen',   icon: '🏃', c: 'var(--run)',    re: /run|loop|lauf/ },
    { key: 'finish', label: 'Finish',  icon: '🏁', c: 'var(--finish)', re: /finish|doel|aankomst/ }
  ];
  function stepOf(name) {
    var n = (name || '').toLowerCase();
    for (var i = 0; i < STEPS.length; i++) if (STEPS[i].re.test(n)) return STEPS[i];
    return null;
  }

  // Annotate parsed data with where the athlete is on the course.
  function classify(d) {
    d.segs = d.segments.map(function (s) { return { data: s, step: stepOf(s.name) }; });
    // UltimateLIVE puts the Finish checkpoint inside the run segment.
    // Keep it there for the full run time, and expose it as the finish step too.
    var finalSeg = d.segs.length ? d.segs[d.segs.length - 1] : null;
    if (finalSeg && finalSeg.step && finalSeg.step.key === 'run') {
      var finishRow = finalSeg.data.rows[finalSeg.data.rows.length - 1];
      var finishStep = stepOf(finishRow.loc);
      if (finishStep && finishStep.key === 'finish' && toSecs(finishRow.raceTime) != null) {
        d.segs.push({ data: { name: finishRow.loc, rows: [finishRow] }, step: finishStep });
      }
    }
    d.last = d.segs.length ? d.segs[d.segs.length - 1] : null;
    d.lastRow = d.last ? d.last.data.rows[d.last.data.rows.length - 1] : null;
    d.finished = !!(d.last && d.last.step && d.last.step.key === 'finish');
    d.lastIdx = d.last && d.last.step ? STEPS.indexOf(d.last.step) : -1;
    d.legs = {};
    d.segs.forEach(function (s) {
      if (!s.step) return;
      var i = STEPS.indexOf(s.step);
      d.legs[s.step.key] = { rows: s.data.rows, done: i < d.lastIdx || d.finished, cur: i === d.lastIdx && !d.finished };
    });
    // race clock runs from the actual start (official start as fallback) until the finish
    var start = null;
    d.info.forEach(function (it) { if (!start && /actu/i.test(it.k) && has(it.v)) start = it.v; });
    d.info.forEach(function (it) { if (!start && /offici/i.test(it.k) && has(it.v)) start = it.v; });
    d.startSecs = toSecs(start);
    d.live = d.startSecs != null && !d.finished;
    d.legStart = null;
    if (d.live && d.lastRow) {
      var rt = toSecs(d.lastRow.raceTime), st = toSecs(d.lastRow.segTime);
      if (rt != null && st != null) d.legStart = rt - st;
      else if (d.segs.length > 1) {
        var prev = d.segs[d.segs.length - 2].data.rows;
        d.legStart = toSecs(prev[prev.length - 1].raceTime);
      } else d.legStart = 0;
    }
    // rankings can lag a checkpoint behind the times; remember the latest row that has them
    d.ranked = null;
    for (var si = d.segs.length - 1; si >= 0 && !d.ranked; si--) {
      var rr = d.segs[si].data.rows;
      for (var ri = rr.length - 1; ri >= 0; ri--) if (has(rr[ri].raceRank[0])) { d.ranked = rr[ri]; break; }
    }
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (m) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
    });
  }
  function has(v) { return v && v !== '-' && v !== '--'; }
  function val(v) { return has(v) ? esc(v) : '<span class="muted">–</span>'; }
  function first(name) { return (name || '').split(' ')[0]; }

  function toSecs(t) {
    if (!has(t)) return null;
    var p = t.split(':').map(Number);
    if (p.some(isNaN)) return null;
    while (p.length < 3) p.unshift(0);
    return p[0] * 3600 + p[1] * 60 + p[2];
  }
  function fmtSecs(s) {
    s = Math.round(Math.abs(s));
    var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
    var pad = function (n) { return (n < 10 ? '0' : '') + n; };
    return h ? h + ':' + pad(m) + ':' + pad(sec) : m + ':' + pad(sec);
  }
  function fmtClock(s) {
    var pad = function (n) { return (n < 10 ? '0' : '') + n; };
    return pad(Math.floor(s / 3600)) + ':' + pad(Math.floor((s % 3600) / 60)) + ':' + pad(s % 60);
  }
  // clock time in the race's own timezone, so "x min geleden" is right anywhere
  function nowSecsNL() {
    try {
      var parts = new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/Amsterdam', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false }).formatToParts(new Date());
      var o = {};
      parts.forEach(function (p) { o[p.type] = Number(p.value); });
      return (o.hour % 24) * 3600 + o.minute * 60 + o.second;
    } catch (e) { return null; }
  }
  function ago(clock) {
    var a = toSecs(clock), b = nowSecsNL();
    if (a == null || b == null) return '';
    var d = b - a;
    if (d < 0 || d > 12 * 3600) return '';
    if (d < 60) return 'zojuist';
    if (d < 3600) return Math.floor(d / 60) + ' min geleden';
    return Math.floor(d / 3600) + ' u ' + Math.floor((d % 3600) / 60) + ' min geleden';
  }

  function liveText(startSecs, offset) {
    var n = nowSecsNL();
    if (n == null) return '–';
    var d = n - startSecs - (offset || 0);
    if (d < 0 || d > 20 * 3600) return '–';
    return fmtSecs(d);
  }
  function liveHtml(x, offset) {
    return '<span data-start="' + x.startSecs + '"' + (offset ? ' data-offset="' + offset + '"' : '') + '>' + liveText(x.startSecs, offset) + '</span>';
  }
  function tickClocks() {
    var els = document.querySelectorAll('[data-start]');
    for (var i = 0; i < els.length; i++) els[i].textContent = liveText(+els[i].getAttribute('data-start'), +els[i].getAttribute('data-offset') || 0);
  }
  setInterval(tickClocks, 1000);

  function ranks(r) {
    if (!r || !has(r[0])) return '';
    var lbl = ['alg', 'gesl', 'cat'], out = [];
    for (var i = 0; i < 3; i++) if (has(r[i])) out.push('<span><b class="num">' + esc(r[i]) + '</b><i>' + lbl[i] + '</i></span>');
    return '<div class="rk">' + out.join('') + '</div>';
  }
  function cell(time, speed, rank) {
    var h = '<div class="c"><div class="big num">' + val(time) + '</div>';
    if (has(speed)) h += '<div class="spd num">' + esc(speed) + '</div>';
    h += ranks(rank);
    return h + '</div>';
  }
  function td(label, inner) { return '<td data-l="' + label + '">' + inner + '</td>'; }
  function plain(v) { return '<div class="c"><div class="big num">' + val(v) + '</div></div>'; }

  /* ---------------------------- head-to-head --------------------------- */
  // Latest checkpoint both athletes have passed, searched from the end of the course back.
  function commonCheckpoint(a, b) {
    for (var i = STEPS.length - 1; i >= 0; i--) {
      var la = a.legs[STEPS[i].key], lb = b.legs[STEPS[i].key];
      if (!la || !lb) continue;
      for (var x = la.rows.length - 1; x >= 0; x--) {
        for (var y = lb.rows.length - 1; y >= 0; y--) {
          if (la.rows[x].loc === lb.rows[y].loc) return { step: STEPS[i], a: la.rows[x], b: lb.rows[y] };
        }
      }
    }
    return null;
  }

  function h2hCard(A, B) {
    var a = A.data, b = B.data;
    if (!a || !b) return '';
    var h = '<div class="card h2h" style="--c:var(--accent)">';
    h += '<div class="sec-head"><span class="ic">⚔️</span><div><h2>Head-to-head</h2>' +
         '<div class="sub">verschil op netto racetijd, gemeten bij het laatste meetpunt dat beiden passeerden</div></div></div>';

    // headline gap
    var cp = commonCheckpoint(a, b);
    h += '<div class="lead">';
    if (cp) {
      var ta = toSecs(cp.a.raceTime), tb = toSecs(cp.b.raceTime);
      if (ta != null && tb != null && ta !== tb) {
        var lead = ta < tb ? A : B;
        h += '<span class="who">' + esc(lead.name) + '</span><span class="gap num">' + fmtSecs(ta - tb) + '</span><span class="at">voor · bij ' + esc(cp.a.loc) + '</span>';
      } else {
        h += '<span class="who">Gelijk</span><span class="at">bij ' + esc(cp.a.loc) + '</span>';
      }
    } else {
      h += '<span class="who">Nog geen gemeenschappelijk meetpunt</span>';
    }
    h += '</div>';

    // grid
    var nameCell = function (x) { return '<div class="hd ath"><span class="n full">' + esc(x.name) + '</span><span class="n short">' + esc(first(x.name)) + '</span><span class="b num">' + esc(x.pid) + '</span></div>'; };
    h += '<div class="cmp">';
    h += '<div class="hd"></div>' + nameCell(A) + nameCell(B) + '<div class="hd df">verschil</div>';

    var row = function (label, icon, color, va, vb, sa, sb, dSecs, dAt) {
      var win = dSecs == null ? 0 : (dSecs < 0 ? -1 : dSecs > 0 ? 1 : 0); // -1: A faster, 1: B faster
      h += '<div class="lg"><span class="dotc" style="--sc:' + color + '">' + icon + '</span>' + label + '</div>';
      var vv = function (v) { return v && typeof v === 'object' ? v.html : val(v); };
      h += '<div class="tv num' + (win === -1 ? ' win' : win === 1 ? ' lose' : '') + '">' + vv(va) + (sa ? '<small>' + sa + '</small>' : '') + '</div>';
      h += '<div class="tv num' + (win === 1 ? ' win' : win === -1 ? ' lose' : '') + '">' + vv(vb) + (sb ? '<small>' + sb + '</small>' : '') + '</div>';
      h += '<div class="df">';
      if (win) h += '<span><b>' + esc(first(win === -1 ? A.name : B.name)) + '</b> ' + fmtSecs(dSecs) + ' sneller' + (dAt ? '<small>bij ' + esc(dAt) + '</small>' : '') + '</span>';
      else if (dSecs === 0) h += '<span>gelijk</span>';
      h += '</div>';
    };

    // current state
    var ra = a.lastRow, rb = b.lastRow;
    var rt = function (x, r) { return x.live ? { html: liveHtml(x) } : (r && r.raceTime); };
    var rtSub = function (x, r) {
      if (!r) return x.live ? 'nog geen meetpunt' : '';
      return (x.live ? esc(r.raceTime) + ' bij ' : 'bij ') + esc(r.loc);
    };
    row(a.live || b.live ? 'Racetijd <span class="ldot"></span>' : 'Racetijd', '⏱', 'var(--text-3)',
        rt(a, ra), rt(b, rb), rtSub(a, ra), rtSub(b, rb), null, '');
    row('Plaats algemeen', '#', 'var(--text-3)',
        a.ranked && a.ranked.raceRank[0], b.ranked && b.ranked.raceRank[0],
        a.ranked && a.ranked !== ra ? 'bij ' + esc(a.ranked.loc) : '', b.ranked && b.ranked !== rb ? 'bij ' + esc(b.ranked.loc) : '', null, '');

    // per leg
    STEPS.forEach(function (st) {
      var la = a.legs[st.key], lb = b.legs[st.key];
      var ta = la ? la.rows[la.rows.length - 1] : null, tb = lb ? lb.rows[lb.rows.length - 1] : null;
      var pick = function (r) { return r ? (st.key === 'finish' ? r.raceTime : r.segTime) : ''; };
      var va = pick(ta), vb = pick(tb);
      var sa = la && la.cur ? 'onderweg' : '', sb = lb && lb.cur ? 'onderweg' : '';
      var d = null, at = '';
      if (la && lb && la.done && lb.done) {
        var x = toSecs(va), y = toSecs(vb);
        if (x != null && y != null) d = x - y;
      } else if (la && lb) {
        // both have splits in this leg but at least one is still in it: compare at the last shared checkpoint
        outer: for (var i = la.rows.length - 1; i >= 0; i--) for (var j = lb.rows.length - 1; j >= 0; j--) {
          if (la.rows[i].loc === lb.rows[j].loc) {
            var x2 = toSecs(la.rows[i].segTime), y2 = toSecs(lb.rows[j].segTime);
            if (x2 != null && y2 != null) { d = x2 - y2; at = la.rows[i].loc; }
            break outer;
          }
        }
      }
      row(st.label, st.icon, st.c, va, vb, sa, sb, d, at);
    });

    h += '</div></div>';
    return h;
  }

  /* ------------------------------- render ------------------------------ */
  function render() {
    var me = cache[current.pid];
    if (!me || !me.data) {
      app.innerHTML = me && me.err
        ? '<div class="card"><div class="msg err"><div class="t">Laden mislukt</div><div>' + esc(me.err.message) + '</div></div></div>'
        : LOADING;
      return;
    }
    var d = me.data, h = '';
    var segs = d.segs, last = d.last, lastRow = d.lastRow, finished = d.finished, lastIdx = d.lastIdx;
    var curStep = last && last.step ? last.step : { c: 'var(--accent)', label: '', icon: '' };

    /* ---- hero ---- */
    var eyebrow = [], meta = [];
    d.info.forEach(function (it) {
      if (/afstand|distance|categorie|category/i.test(it.k)) eyebrow.push(it.v);
      else meta.push('<span>' + esc(it.k) + ' <b>' + esc(it.v) + '</b></span>');
    });

    h += '<section class="hero" style="--c:' + curStep.c + '"><div class="hero-in">';
    h += '<div class="hero-row"><div>';
    if (eyebrow.length) h += '<div class="eyebrow">' + esc(eyebrow.join(' · ')) + '</div>';
    h += '<h1>' + esc(d.name || 'Deelnemer') + '</h1>';
    if (meta.length) h += '<div class="meta">' + meta.join('') + '</div>';
    h += '</div>';
    if (d.bib) h += '<div class="bib"><span class="k">Startnr</span><span class="v num">' + esc(d.bib) + '</span></div>';
    h += '</div>';

    // race strip: canonical order, merged with whatever the feed has
    var extras = segs.filter(function (s) { return !s.step; });
    h += '<ol class="strip">';
    STEPS.forEach(function (st, i) {
      var leg = d.legs[st.key];
      var status = 'todo';
      if (leg && leg.done) status = 'done';
      else if (leg && leg.cur) status = 'cur';
      else if (!leg && i < lastIdx) status = 'done';
      var t = leg ? (st.key === 'finish' ? leg.rows[leg.rows.length - 1].raceTime : leg.rows[leg.rows.length - 1].segTime) : '';
      var tm = status === 'cur' && d.live && d.legStart != null ? liveHtml(d, d.legStart) : (has(t) ? esc(t) : '–');
      h += '<li class="step ' + status + '" style="--sc:' + st.c + '">' +
           '<div class="hd"><span class="ic">' + (status === 'done' ? '✓' : st.icon) + '</span>' + esc(st.label) + '</div>' +
           '<div class="tm num">' + tm + (status === 'cur' ? '<small>onderweg</small>' : '') + '</div></li>';
    });
    extras.forEach(function (s) {
      var t = s.data.rows[s.data.rows.length - 1].segTime;
      var isCur = s === last;
      var tm2 = isCur && d.live && d.legStart != null ? liveHtml(d, d.legStart) : (has(t) ? esc(t) : '–');
      h += '<li class="step ' + (isCur ? 'cur' : 'done') + '" style="--sc:var(--other)">' +
           '<div class="hd"><span class="ic">' + (isCur ? '●' : '✓') + '</span>' + esc(s.data.name) + '</div>' +
           '<div class="tm num">' + tm2 + '</div></li>';
    });
    h += '</ol></div></section>';

    /* ---- stat tiles ---- */
    if (lastRow || d.live) {
      var rk = d.ranked ? d.ranked.raceRank : ['', '', ''];
      var rkAt = d.ranked && d.ranked !== lastRow ? ' bij ' + esc(d.ranked.loc) : '';
      var when = lastRow ? ago(lastRow.clock) : '';
      h += '<div class="stats">';
      if (d.live) {
        h += '<div class="stat hl s-time"><div class="k">Racetijd <span class="ldot"></span></div><div class="v num">' + liveHtml(d) + '</div>' +
             '<div class="s">' + (lastRow ? 'laatste meetpunt ' + esc(lastRow.raceTime) + ' bij ' + esc(lastRow.loc) : 'gestart om ' + esc(fmtClock(d.startSecs))) + '</div></div>';
      } else {
        h += '<div class="stat hl s-time"><div class="k">' + (finished ? 'Eindtijd' : 'Racetijd') + '</div><div class="v num">' + val(lastRow && lastRow.raceTime) + '</div><div class="s">bij ' + esc(lastRow ? lastRow.loc : '') + '</div></div>';
      }
      h += '<div class="stat s-rank"><div class="k">Algemeen</div><div class="v num">' + val(rk[0]) + '</div><div class="s">plaats totaal' + rkAt + '</div></div>';
      h += '<div class="stat s-rank"><div class="k">Geslacht</div><div class="v num">' + val(rk[1]) + '</div><div class="s">in geslacht' + rkAt + '</div></div>';
      h += '<div class="stat s-rank"><div class="k">Categorie</div><div class="v num">' + val(rk[2]) + '</div><div class="s">in categorie' + rkAt + '</div></div>';
      h += '<div class="stat s-last"><div class="k">Laatste passage</div><div class="v num">' + val(lastRow && lastRow.clock) + '</div><div class="s">' + (when ? esc(when) : 'tijdstip') + '</div></div>';
      h += '</div>';
    }

    /* ---- head-to-head (selected athlete first) ---- */
    if (ATHLETES.length > 1) {
      var other = ATHLETES.filter(function (x) { return x !== current; })[0];
      var oc = cache[other.pid];
      h += h2hCard({ name: current.name, pid: current.pid, data: d }, { name: other.name, pid: other.pid, data: oc && oc.data });
    }

    /* ---- segment cards ---- */
    segs.forEach(function (s) {
      var st = s.step || { c: 'var(--other)', label: s.data.name, icon: '●' };
      var rows = s.data.rows;
      var tot = st.key === 'finish' ? rows[rows.length - 1].raceTime : rows[rows.length - 1].segTime;
      var isCur = s === last && !finished;

      h += '<div class="card seg-card" style="--c:' + st.c + '">';
      h += '<div class="sec-head"><span class="ic">' + st.icon + '</span><div><h2>' + esc(st.label) + '</h2>' +
           (st.label.toLowerCase() !== s.data.name.toLowerCase() ? '<div class="sub">' + esc(s.data.name) + '</div>' : '') + '</div>';
      if (isCur) h += '<span class="tag">onderweg</span>';
      if (isCur && d.live && d.legStart != null) h += '<span class="tot num">' + liveHtml(d, d.legStart) + '</span>';
      else if (has(tot)) h += '<span class="tot num">' + esc(tot) + '</span>';
      h += '</div>';

      h += '<div class="scroll"><table><thead><tr>' +
           '<th>Meetpunt</th><th>Racetijd</th><th>Segment</th><th>Ronde</th><th>Tijdstip</th>' +
           '</tr></thead><tbody>';
      rows.forEach(function (r, i) {
        var latest = isCur && i === rows.length - 1;
        h += '<tr' + (latest ? ' class="latest"' : '') + '>' +
             td('Meetpunt', '<div class="c"><div class="loc">' + esc(r.loc) + (latest ? '<span class="sub">laatste doorkomst</span>' : '') + '</div></div>') +
             td('Racetijd', cell(r.raceTime, null, r.raceRank)) +
             td('Segment', cell(r.segTime, r.segSpeed, r.segRank)) +
             td('Ronde', cell(r.lapTime, r.lapSpeed, r.lapRank)) +
             td('Tijdstip', plain(r.clock)) +
             '</tr>';
      });
      h += '</tbody></table></div></div>';
    });

    /* ---- projections ---- */
    if (d.projections.length) {
      h += '<div class="card" style="--c:var(--text-3)">';
      h += '<div class="sec-head"><span class="ic">📈</span><div><h2>Verwachte doorkomsten</h2>' +
           (d.projTitle ? '<div class="sub">' + esc(d.projTitle) + '</div>' : '') + '</div></div>';
      h += '<div class="scroll"><table><thead><tr>' +
           '<th>Meetpunt</th><th>Racetijd</th><th>Segment</th><th>Ronde</th><th>Tijdstip</th>' +
           '</tr></thead><tbody>';
      d.projections.forEach(function (p) {
        h += '<tr>' +
             td('Meetpunt', '<div class="c"><div class="loc">' + esc(p.loc) + '</div></div>') +
             td('Racetijd', plain(p.raceTime)) +
             td('Segment', plain(p.segTime)) +
             td('Ronde', plain(p.lapTime)) +
             td('Tijdstip', plain(p.clock)) +
             '</tr>';
      });
      h += '</tbody></table></div></div>';
    }

    if (!segs.length && !d.projections.length) {
      h += '<div class="card"><div class="msg"><div class="t">Nog geen tussentijden</div>' +
           '<div>Zodra de deelnemer een meetpunt passeert verschijnen de tijden hier.</div></div></div>';
    }

    app.innerHTML = h;
  }

  /* ---------------------------- athlete switch ---------------------------- */
  var cache = {};           // pid -> { data, err }
  var current = ATHLETES[0];
  var seq = 0;              // ignore responses that arrive after a newer refresh started

  function findAthlete(pid) {
    for (var i = 0; i < ATHLETES.length; i++) if (ATHLETES[i].pid === pid) return ATHLETES[i];
    return null;
  }
  function initialAthlete() {
    var fromHash = findAthlete(location.hash.replace('#', ''));
    if (fromHash) return fromHash;
    try { var saved = findAthlete(localStorage.getItem('pid')); if (saved) return saved; } catch (e) {}
    return ATHLETES[0];
  }
  function renderTabs() {
    tabs.innerHTML = ATHLETES.map(function (a) {
      return '<button class="tab" role="tab" type="button" data-pid="' + a.pid + '" aria-selected="' + (a === current) + '">' +
             '<span class="n">' + esc(a.name) + '</span><span class="b num">' + esc(a.pid) + '</span></button>';
    }).join('');
  }
  function select(a) {
    if (!a || a === current) return;
    current = a;
    try { localStorage.setItem('pid', a.pid); } catch (e) {}
    if (location.hash !== '#' + a.pid) history.replaceState(null, '', '#' + a.pid);
    renderTabs();
    render();                 // both athletes are prefetched, so switching is instant
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  tabs.addEventListener('click', function (e) {
    var b = e.target.closest('.tab');
    if (b) select(findAthlete(b.getAttribute('data-pid')));
  });
  window.addEventListener('hashchange', function () { select(findAthlete(location.hash.replace('#', ''))); });

  /* ------------------------------- cycle ------------------------------- */
  // Fetch every athlete in turn (shared sink), re-rendering as each one lands
  // so the selected athlete never waits on the others.
  function tick() {
    var mine = ++seq;
    refreshBtn.disabled = true;
    var order = [current].concat(ATHLETES.filter(function (x) { return x !== current; }));
    var chain = Promise.resolve();
    order.forEach(function (a) {
      chain = chain.then(function () {
        if (mine !== seq) return;
        return load(a.pid).then(function (root) {
          if (mine !== seq) return;
          cache[a.pid] = { data: parse(root), err: null };
        }, function (e) {
          if (mine !== seq) return;
          cache[a.pid] = { data: cache[a.pid] && cache[a.pid].data, err: e };
        }).then(function () {
          if (mine !== seq) return;
          render();
          stamp.textContent = 'bijgewerkt ' + new Date().toLocaleTimeString('nl-NL');
        });
      });
    });
    return chain.then(function () { if (mine === seq) refreshBtn.disabled = false; });
  }

  current = initialAthlete();
  renderTabs();
  refreshBtn.addEventListener('click', tick);
  tick();
  setInterval(tick, REFRESH_MS);
})();
</script>
</body>
</html>
